<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoreboard</title>
<style>
:root{--red:#d62828;--blue:#1d4ed8;--ink:#fff;--bar:rgba(0,0,0,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:#111;color:var(--ink);font-family:"Trebuchet MS",system-ui,Arial,sans-serif;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:1fr 1fr;position:relative}
.side{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.side.a{background:var(--red)}.side.b{background:var(--blue)}
.name{font-size:calc(clamp(18px,4vw,34px)*var(--ns,1));font-weight:700;letter-spacing:.02em;margin-top:6px;max-width:80%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-size:calc(clamp(90px,28vw,300px)*var(--ss,1));font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ball{position:relative;font-size:calc(clamp(24px,5vw,44px)*var(--bs,1))}.crown{position:absolute;top:-.8em;left:50%;transform:translateX(-50%) rotate(14deg);font-size:.75em;display:none}.crown.on{display:block}.bi{display:inline-block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45));transform-style:preserve-3d}.gball{width:1.05em;height:1.05em;border-radius:50%;vertical-align:-.14em;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),rgba(255,255,255,0) 38%),radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 48%,rgba(0,0,0,.6) 100%),url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100' preserveAspectRatio='none'><rect width='200' height='100' fill='white'/><path d='M50.0 35.0 L50.0 21.0 M64.3 45.4 L77.6 41.0 M58.8 62.1 L67.0 73.5 M41.2 62.1 L33.0 73.5 M35.7 45.4 L22.4 41.0 M150.0 35.0 L150.0 21.0 M164.3 45.4 L177.6 41.0 M158.8 62.1 L167.0 73.5 M141.2 62.1 L133.0 73.5 M135.7 45.4 L122.4 41.0' stroke='%23999' stroke-width='1.2' fill='none'/><path d='M50.0 35.0 L64.3 45.4 L58.8 62.1 L41.2 62.1 L35.7 45.4Z M150.0 35.0 L164.3 45.4 L158.8 62.1 L141.2 62.1 L135.7 45.4Z M0.0 -15.0 L14.3 -4.6 L8.8 12.1 L-8.8 12.1 L-14.3 -4.6Z M100.0 -15.0 L114.3 -4.6 L108.8 12.1 L91.2 12.1 L85.7 -4.6Z M200.0 -15.0 L214.3 -4.6 L208.8 12.1 L191.2 12.1 L185.7 -4.6Z M0.0 85.0 L14.3 95.4 L8.8 112.1 L-8.8 112.1 L-14.3 95.4Z M100.0 85.0 L114.3 95.4 L108.8 112.1 L91.2 112.1 L85.7 95.4Z M200.0 85.0 L214.3 95.4 L208.8 112.1 L191.2 112.1 L185.7 95.4Z' fill='%23222'/></svg>");background-size:auto,auto,200% 100%;background-repeat:no-repeat,no-repeat,repeat-x;background-position:0px 0px,0px 0px,0em 0px}.panel input[type=range]{padding:0;border:0}.panel label{font-weight:700}.panel .emo{font-size:22px;padding:8px}.panel .emo.sel{outline:3px solid #111}
.ico{position:absolute;width:44px;height:44px;border:0;border-radius:12px;background:var(--bar);color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer}
.ico:focus-visible,.mid button:focus-visible,.panel button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.edit{top:10px;left:10px}.minus{bottom:10px;left:10px;font-size:26px}
.b .edit{left:auto;right:10px}.b .minus{left:auto;right:10px}
.mid{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;background:#fff;color:#111;border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.timer{display:flex;align-items:center;gap:6px;font-size:clamp(16px,3vw,24px);font-weight:700;font-variant-numeric:tabular-nums}
.mid button{border:0;background:#eee;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
.sets{font-size:clamp(18px,3.5vw,28px);font-weight:800}
.target{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:5;background:#fff;color:#111;border:0;border-radius:12px;padding:8px 18px;font-size:clamp(18px,3.5vw,28px);font-weight:800;cursor:pointer}
.overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.75);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.overlay.on{display:flex}
.overlay h2{font-size:clamp(28px,7vw,64px);margin:0}
.panel{background:#fff;color:#111;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;width:min(92%,320px)}
.panel input{font-size:20px;padding:10px;border:2px solid #ccc;border-radius:10px;width:100%}
.panel .row{display:flex;gap:8px}
.panel button,.overlay button{flex:1;border:0;border-radius:12px;padding:12px;font-size:17px;font-weight:700;cursor:pointer;background:#111;color:#fff}
.panel button.alt{background:#e5e5e5;color:#111}.panel{max-height:calc(100% - 16px);overflow-y:auto;width:min(92%,360px)}.panel .stick{position:sticky;bottom:0;background:#fff;padding-top:8px}.mid .rst{width:auto;padding:0 10px;font-size:13px;font-weight:700}.panel .sw button{flex:1;min-width:0;height:30px;padding:0;border-radius:8px;border:3px solid transparent}.panel .sw button.sel{border-color:#111}.panel input[type=color]{padding:2px;height:40px;width:100%;border:2px solid #ccc;border-radius:10px;background:none;cursor:pointer}@media (max-height:520px){.panel{gap:6px;padding:12px}.panel .emo{padding:4px;font-size:18px}.panel button{padding:8px}}
@media (orientation:portrait){
 #app{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
 .mid{top:50%;transform:translate(-50%,-50%)}
 .target{bottom:auto;top:calc(50% + 58px)}
}
</style>
</head>
<body>
<div id="app">
 <div class="side a" id="sa" role="button" tabindex="0" aria-label="Player 1 score plus one">
  <button class="ico edit" data-edit="a" aria-label="Edit name">✎</button>
  <div class="ball"><span class="crown" id="ca">👑</span><span class="bi">⚽</span></div><div class="name" id="na"></div><div class="score" id="ta">0</div>
  <button class="ico minus" data-minus="a" aria-label="Minus one">−</button>
 </div>
 <div class="side b" id="sb" role="button" tabindex="0" aria-label="Player 2 score plus one">
  <button class="ico edit" data-edit="b" aria-label="Edit name">✎</button>
  <div class="ball"><span class="crown" id="cb">👑</span><span class="bi">⚽</span></div><div class="name" id="nb"></div><div class="score" id="tb">0</div>
  <button class="ico minus" data-minus="b" aria-label="Minus one">−</button>
 </div>
 <div class="mid">
  <div class="timer"><button id="play" aria-label="Start or pause">▶</button><span id="time">00:00</span><button id="reset" aria-label="Reset timer">↺</button><button id="gear" aria-label="Settings">⚙</button><button id="fs" aria-label="Full screen">⤢</button></div>
  <div style="display:flex;align-items:center;gap:8px"><div class="sets" id="sets">0 – 0</div><button class="rst" id="rst" aria-label="Reset scores">Reset</button></div>
 </div>
 <button class="target" id="target" aria-label="Change target score">Target: <span id="tv">100</span></button>

 <div class="overlay" id="win"><h2 id="wt"></h2><div style="display:flex;gap:10px;width:min(90%,360px)"><button id="next">Next round</button></div></div>
 <div class="overlay" id="set"><div class="panel">
 <label for="rt">Target score (0 = no limit)</label><input type="number" id="rt" min="0" inputmode="numeric">
 <label for="rs">Score size</label><input type="range" id="rs" min="0.5" max="1.3" step="0.05">
 <label for="rn">Name size</label><input type="range" id="rn" min="0.5" max="2" step="0.05">
 <label for="rb">Icon size</label><input type="range" id="rb" min="0.5" max="2.5" step="0.05">
 <label>Left colour</label><div class="row sw" id="swa"></div><input type="color" id="pka" aria-label="Left colour picker">
 <label>Right colour</label><div class="row sw" id="swb"></div><input type="color" id="pkb" aria-label="Right colour picker">
 <label>Icon</label><div class="row" id="emos"></div>
 <label><input type="checkbox" id="rc" style="width:auto"> Show crown for leader</label>
 <label><input type="checkbox" id="rv" style="width:auto"> Announce score (awaaz)</label>
 <label><input type="checkbox" id="ra" style="width:auto"> Airport style (chime + slow)</label>
 <label for="rvs">Voice</label><select id="rvs" style="font-size:16px;padding:10px;border:2px solid #ccc;border-radius:10px;width:100%"></select>
 <label><input type="checkbox" id="rg" style="width:auto"> 3D globe football (new style)</label>
 <div class="row"><button class="alt" id="rz">Reset scores</button><button class="alt" id="rq">Reset sets</button></div>
 <div class="row stick"><button class="alt" id="rd">Default</button><button id="rx">Done</button></div>
</div></div>
 <div class="overlay" id="dlg"><div class="panel"><label id="dl" for="di"></label><input id="di"><div class="row"><button class="alt" id="dc">Cancel</button><button id="ds">Save</button></div></div></div>
</div>
<script>
var S={a:0,b:0,na:"Ronaldo",nb:"Messi",sa:0,sb:0,target:100,sec:0,ss:1,ns:1,bs:1,icon:"⚽",crown:true,ca:"#d62828",cb:"#1d4ed8",globe:false,say:true,voice:"",air:true};
try{var saved=JSON.parse(localStorage.getItem("sb1")||"null");if(saved)S=Object.assign(S,saved)}catch(e){}
var running=false,iv=null,busy=false;
function $(i){return document.getElementById(i)}
function save(){try{localStorage.setItem("sb1",JSON.stringify(S))}catch(e){}}
function fmt(s){var m=Math.floor(s/60),r=s%60;return(m<10?"0":"")+m+":"+(r<10?"0":"")+r}
function applyView(){var r=document.documentElement.style;r.setProperty("--ss",S.ss);r.setProperty("--ns",S.ns);r.setProperty("--bs",S.bs);r.setProperty("--red",S.ca);r.setProperty("--blue",S.cb);
 document.querySelectorAll(".bi").forEach(function(e){var g=S.icon==="⚽"&&S.globe;e.classList.toggle("gball",g);e.textContent=g?"":S.icon});
 $("ca").classList.toggle("on",S.crown&&S.a>S.b);$("cb").classList.toggle("on",S.crown&&S.b>S.a)}
function draw(){applyView();$("ta").textContent=S.a;$("tb").textContent=S.b;$("na").textContent=S.na;$("nb").textContent=S.nb;
 $("sets").textContent=S.sa+" – "+S.sb;$("tv").textContent=S.target>0?S.target:"Off";$("time").textContent=fmt(S.sec);$("play").textContent=running?"❚❚":"▶";save()}
function spin(k){var e=$("s"+k).querySelector(".bi");if(!e||!e.animate)return;if(e.classList.contains("gball")){e.animate([{backgroundPositionX:"0px, 0px, 0em",transform:"scale(1)"},{backgroundPositionX:"0px, 0px, 1em",transform:"scale(1.25)",offset:.5},{backgroundPositionX:"0px, 0px, 2em",transform:"scale(1)"}],{duration:900,easing:"ease-in-out"})}else{e.animate([{transform:"perspective(260px) rotateY(0deg) scale(1)"},{transform:"perspective(260px) rotateY(180deg) scale(1.35)",offset:.5},{transform:"perspective(260px) rotateY(360deg) scale(1)"}],{duration:700,easing:"ease-in-out"})}}
var FEM=/female|woman|samantha|zira|aria|jenny|susan|hazel|karen|moira|tessa|victoria|fiona|serena|allison|ava|joanna|salli|kendra|kimberly|ivy|libby|sonia|natasha|catherine|google uk english female/i;
var voices=[];
function loadVoices(){if(!window.speechSynthesis)return;voices=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)});
 var sel=$("rvs");if(!sel)return;sel.innerHTML="";var a=document.createElement("option");a.value="";a.textContent="Auto (girl voice)";sel.appendChild(a);
 voices.forEach(function(v){var o=document.createElement("option");o.value=v.name;o.textContent=v.name+" ("+v.lang+")";sel.appendChild(o)});sel.value=S.voice||""}
function pickVoice(){if(S.voice){for(var i=0;i<voices.length;i++)if(voices[i].name===S.voice)return voices[i]}
 var best=null;for(var j=0;j<voices.length;j++){var v=voices[j];if(FEM.test(v.name)&&!/male$/i.test(v.name.trim().replace(/female/i,"")+"")){if(/natural|neural|online/i.test(v.name))return v;if(!best||/^en-US/i.test(v.lang))best=best&&/^en-US/i.test(best.lang)?best:v}}
 return best}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
var ac=null,st=null;
function chime(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();var t=ac.currentTime;
 [[659.25,0],[523.25,.45]].forEach(function(n){var o=ac.createOscillator(),g=ac.createGain(),s0=t+n[1];o.type="sine";o.frequency.value=n[0];
  g.gain.setValueAtTime(0,s0);g.gain.linearRampToValueAtTime(.35,s0+.02);g.gain.exponentialRampToValueAtTime(.001,s0+.9);
  o.connect(g);g.connect(ac.destination);o.start(s0);o.stop(s0+1)})}catch(e){}}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="en-US";var v=pickVoice();if(v){u.voice=v;u.lang=v.lang}
 if(S.air){u.rate=.82;u.pitch=1;u.volume=1}else{u.rate=.95;u.pitch=1.2;u.volume=.9}speechSynthesis.speak(u)}catch(e){}}
function say(t){if(!S.say||!window.speechSynthesis)return;try{speechSynthesis.cancel();clearTimeout(st);
 if(S.air){chime();st=setTimeout(function(){speak(t)},1100)}else{speak(t)}}catch(e){}}
function ann(w){var sc=S.na+", "+S.a+". "+S.nb+", "+S.b+".";
 if(S.air)say(w?w+" has won the match. Final score. "+sc:sc);
 else say(w?w+" wins! Final score "+sc:S.na+" "+S.a+", "+S.nb+" "+S.b)}
function add(k,d){if(busy)return;var old=S[k];S[k]=Math.max(0,S[k]+d);if(S[k]===old)return;if(d>0)spin(k);draw();
 var won=d>0&&S.target>0&&S[k]>=S.target;
 if(!won)ann();
 if(d>0&&S.target>0&&S[k]>=S.target){busy=true;if(running)toggle();
  if(k==="a")S.sa++;else S.sb++;draw();
  $("wt").textContent=(k==="a"?S.na:S.nb)+" wins! 🏆";ann(k==="a"?S.na:S.nb);$("win").classList.add("on")}}
$("next").onclick=function(){S.a=0;S.b=0;S.sec=0;busy=false;$("win").classList.remove("on");draw()};
function toggle(){running=!running;if(running){iv=setInterval(function(){S.sec++;draw()},1000)}else{clearInterval(iv)}draw()}
$("play").onclick=function(e){e.stopPropagation();toggle()};
$("reset").onclick=function(e){e.stopPropagation();if(running)toggle();S.sec=0;draw()};
["a","b"].forEach(function(k){var el=$("s"+k);
 el.onclick=function(){add(k,1)};
 el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();add(k,1)}}});
document.querySelectorAll("[data-minus]").forEach(function(b){b.onclick=function(e){e.stopPropagation();add(b.dataset.minus,-1)}});
var mode=null;
function ask(label,val,m){mode=m;$("dl").textContent=label;$("di").value=val;$("di").type=(m==="t")?"number":"text";$("dlg").classList.add("on");$("di").focus()}
document.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(e){e.stopPropagation();var k=b.dataset.edit;ask("Naam likhein",S["n"+k],"n"+k)}});
$("target").onclick=function(){ask("Target score (jo pehle pohanche woh jeete)",S.target,"t")};
$("dc").onclick=function(){$("dlg").classList.remove("on")};
$("ds").onclick=function(){var v=$("di").value.trim();
 if(mode==="t"){var n=parseInt(v,10);if(n>=0)S.target=n}else if(v){S[mode]=v.slice(0,20)}
 $("dlg").classList.remove("on");draw()};
$("di").onkeydown=function(e){if(e.key==="Enter")$("ds").click()};
var EM=["⚽","🏀","🏏","🎾","🏐"];
function syncSet(){markSw();$("rg").checked=S.globe;$("rv").checked=S.say;$("ra").checked=S.air;if($("rvs"))$("rvs").value=S.voice||"";$("rt").value=S.target;$("rs").value=S.ss;$("rn").value=S.ns;$("rb").value=S.bs;$("rc").checked=S.crown;
 document.querySelectorAll(".emo").forEach(function(b){b.classList.toggle("sel",b.textContent===S.icon)})}
EM.forEach(function(e){var b=document.createElement("button");b.className="alt emo";b.textContent=e;b.onclick=function(){S.icon=e;syncSet();draw()};$("emos").appendChild(b)});
var COLS=["#d62828","#b91c1c","#ef4444","#7f1d1d","#1d4ed8","#2563eb","#0ea5e9","#1e3a8a"];
function markSw(){$("pka").value=S.ca;$("pkb").value=S.cb;["a","b"].forEach(function(k){document.querySelectorAll("#sw"+k+" button").forEach(function(b){b.classList.toggle("sel",b.dataset.c===S["c"+k])})})}
["a","b"].forEach(function(k){COLS.forEach(function(c){var b=document.createElement("button");b.dataset.c=c;b.style.background=c;b.setAttribute("aria-label","Colour "+c);b.onclick=function(){S["c"+k]=c;markSw();draw()};$("sw"+k).appendChild(b)})});
$("pka").oninput=function(){S.ca=this.value;markSw();draw()};
$("pkb").oninput=function(){S.cb=this.value;markSw();draw()};
$("rvs").onchange=function(){S.voice=this.value;save();ann()};
$("ra").onchange=function(){S.air=this.checked;save();ann()};
$("rv").onchange=function(){S.say=this.checked;if(S.say)say("Announcements on")};
$("gear").onclick=function(ev){ev.stopPropagation();syncSet();$("set").classList.add("on")};
$("rs").oninput=function(){S.ss=+this.value;draw()};
$("rn").oninput=function(){S.ns=+this.value;draw()};
$("rb").oninput=function(){S.bs=+this.value;draw()};
$("rt").oninput=function(){var n=parseInt(this.value,10);if(n>=0){S.target=n;draw()}};
$("rg").onchange=function(){S.globe=this.checked;draw()};
$("rc").onchange=function(){S.crown=this.checked;draw()};
$("rd").onclick=function(){S.ss=1;S.ns=1;S.bs=1;S.icon="⚽";S.crown=true;S.globe=false;S.ca="#d62828";S.cb="#1d4ed8";syncSet();draw()};
$("rx").onclick=function(){$("set").classList.remove("on")};
function resetScores(){S.a=0;S.b=0;busy=false;$("win").classList.remove("on");draw()}
var rtimer=null;
$("rst").onclick=function(e){e.stopPropagation();var b=this;if(rtimer){clearTimeout(rtimer);rtimer=null;b.textContent="Reset";resetScores()}else{b.textContent="Sure?";rtimer=setTimeout(function(){rtimer=null;b.textContent="Reset"},3000)}};
$("rz").onclick=resetScores;
$("rq").onclick=function(){S.sa=0;S.sb=0;draw()};
$("fs").onclick=function(ev){ev.stopPropagation();var d=document,el=d.documentElement;
 try{if(d.fullscreenElement){d.exitFullscreen()}else{var p=el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen&&el.webkitRequestFullscreen();
  if(p&&p.then)p.then(function(){try{screen.orientation.lock("landscape").catch(function(){})}catch(e){}}).catch(function(){})}}catch(e){}};
draw();
</script>
</body>
</html>
